# =============================================================================
# Site Settings
# =============================================================================
title: "iOS and Mac apps crafted with love"
email: ps.applecontact@gmail.com
description: >-
  Independent iOS and macOS app developer since 2007. Browse a collection of 70+
  carefully crafted apps including Safari extensions, productivity tools, health
  and wellness apps, and more on the Apple App Store.
baseurl: ""
url: "https://pstan.fr"
logo: "img/SiteIcon.svg"

github: [metadata]

# =============================================================================
# Build Settings
# =============================================================================
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# =============================================================================
# Blog Settings
# =============================================================================
future: true
permalink: /blog/:categories/:title/

# =============================================================================
# Defaults
# =============================================================================
defaults:
  - scope:
      path: "apps"
      type: "pages"
    values:
      layout: "app-page"
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      author: "Tenpercent Apps"

# =============================================================================
# Exclude from processing
# =============================================================================
exclude:
  # seo/ holds Google Search Console OAuth credentials (seo/secrets/*.json) plus
  # private analytics. It is gitignored, so GitHub Pages never sees it — but a
  # local `jekyll build` was copying seo/secrets/token.json and client_secret.json
  # straight into _site/. Excluding here means the build itself refuses to emit
  # them, even if the gitignore is ever changed or the site is deployed from a
  # local _site/ rather than from the repo.
  - seo/
  - .claude/
  - .claude-work/
  # Developer README, not a page. Was being published at /assets/fonts/ and
  # listed in the sitemap as a thin, indexable page.
  - assets/fonts/README.md
  - CLAUDE.md
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
